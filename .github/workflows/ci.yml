name: CI

# The release workflow only runs on tags, so without this there is no signal
# on ordinary pushes — and no Rust toolchain exists on the development machine,
# making CI the only place the backend compiles before a release is cut.
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        run: bunx tsc --noEmit

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
